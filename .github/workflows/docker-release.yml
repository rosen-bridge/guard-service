name: Build and Push Docker Image

on:
  release:
    types: [published]
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        type: string
        default: dev
      environment:
        description: 'GitHub environment name (e.g. pandora, public-launch, ...)'
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/guard-service
  SERVICE_DIR: ./services/guard-service

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && vars.DEV_PUSH_ENVIRONMENT
      || github.event_name == 'release' && vars.RELEASE_ENVIRONMENT
      || github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(vars.PLATFORM_LIST || '["linux/amd64"]') }}
        node-version: [22.18]

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Contracts
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          mkdir -p ./config
          npx @rosen-bridge/cli@${{ vars.ROSEN_CLI_VERSION || 'latest' }} download-assets -c ${{ vars.RELEASE_NAME }} ${{ vars.RELEASE_TAG }} -o ./config
          mv ./config/tokens*.json ./config/tokens.json

      - name: Move the Files
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          npx @rosen-bridge/cli@${{ vars.ROSEN_CLI_VERSION || 'latest' }} download-tss -n linux -r -t tss-api -o ./bin/
          mv ./docker/production.yaml ./config/
          mv ./docker/custom-environment-variables.yaml ./config/
          7z x ./bin/rosenTss-linux-* -obin/ && rm -rf ./bin/*.zip
          mv ./bin/rosenTss-* ./bin/rosenTss

      - name: Set up QEMU
        if: contains(matrix.platform, 'arm')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for artifact
        shell: bash
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Restore BuildKit cache mounts
        id: buildkit-cache
        uses: actions/cache@v5
        with:
          path: /tmp/cache-mounts
          key: buildkit-cache-mounts-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ github.ref_name }}-${{ hashFiles('services/guard-service/Dockerfile', 'package-lock.json') }}
          restore-keys: |
            buildkit-cache-mounts-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-${{ github.ref_name }}-
            buildkit-cache-mounts-${{ runner.os }}-${{ env.PLATFORM_PAIR }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: /tmp/cache-mounts
          dockerfile: ${{ env.SERVICE_DIR }}/Dockerfile
          skip-extraction: ${{ steps.buildkit-cache.outputs.cache-hit }}

      - name: Docker Metadata action
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest file
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tag for workflow_dispatch
        id: set-tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          branch="${{ github.event.inputs.branch }}"
          branch="${branch//\//-}"
          echo "tag=${branch}-${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata action
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=\d+\.\d+\.\d+,enable=${{ github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.set-tag.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Login to GHCR Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Docker image for the guard-service owned by rosen-bridge organization." \
            $(printf ' -t %s' $TAGS) \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
